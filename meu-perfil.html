<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/logo-cursiva.png">
<meta name="description" content="Seus dados e perfil aromático salvos no Sagrado de Mim.">
<title>Sagrado de Mim — Meu Perfil</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at 30% 20%, #f6efe6, #ece0cf);
    font-family: Georgia, 'Liberation Serif', serif;
    color: #332f28;
    min-height: 100vh;
  }
  .card {
    background: #fbf7f0;
    border: 1px solid rgba(61,58,52,0.25);
    border-radius: 18px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(61,58,52,0.08);
  }
  h1 { font-size: 22px; letter-spacing: 2px; margin: 0 0 6px; font-weight: normal; text-align:center; }
  .back-link { display:block; text-align:center; font-family:Arial,sans-serif; font-size:12px; color:#8a8676; text-decoration:none; margin-bottom:14px; }
  .section-title {
    font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #8a8676; margin: 24px 0 12px;
  }
  label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; display: block; margin-bottom: 4px; margin-top: 12px; }
  input[type="text"], input[type="email"] {
    width: 100%; font-family: Arial, sans-serif; font-size: 14px; padding: 10px 12px;
    border-radius: 8px; border: 1px solid rgba(61,58,52,0.3);
  }
  input[disabled] { background: #f0ede6; color: #8a8676; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .perfil-box {
    background: #eef1e6; border-radius: 12px; padding: 16px 18px; margin: 8px 0 4px;
  }
  .perfil-box p { margin: 4px 0; font-family: Arial, sans-serif; font-size: 14px; }
  .empty-perfil { font-family: Arial, sans-serif; font-size: 13px; color: #8a8676; text-align: center; padding: 10px 0; }
  .save-btn {
    width: 100%; font-family: Arial, sans-serif; font-weight: 700; font-size: 15px;
    background: #556238; color: #fff; padding: 14px; border-radius: 10px; border: none; margin-top: 22px; cursor: pointer;
  }
  .save-btn:disabled { opacity: 0.6; }
  .save-msg { font-family: Arial, sans-serif; color: #556238; font-size: 13px; text-align: center; margin-top: 10px; display:none; }
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">&larr; Voltar para o início</a>

    <div style="display:flex; justify-content:center; gap:18px; margin-bottom:18px; font-family:Arial,sans-serif; font-size:12px;">
      <a href="carrinho.html" style="color:#8a8676; text-decoration:none;">🛒 Carrinho</a>
      <a href="meu-perfil.html" style="color:#8a8676; text-decoration:none;">Meu perfil</a>
      <a href="meus-pedidos.html" style="color:#8a8676; text-decoration:none;">Meus pedidos</a>
    </div>
    <h1>MEU PERFIL</h1>

    <p class="section-title">Seu perfil aromático</p>
    <div id="perfil-aromatico-area"></div>

    <p class="section-title">Seus dados</p>
    <label for="email-field">E-mail</label>
    <input type="email" id="email-field" disabled>

    <label for="nome-field">Nome completo</label>
    <input type="text" id="nome-field" placeholder="Seu nome completo">

    <label for="cpf-field">CPF</label>
    <input type="text" id="cpf-field" placeholder="000.000.000-00">

    <label for="cep-field">CEP</label>
    <input type="text" id="cep-field" placeholder="00000-000">

    <label for="endereco-field">Endereço (rua, número, bairro)</label>
    <input type="text" id="endereco-field" placeholder="Rua, número, bairro">

    <div class="row">
      <div>
        <label for="cidade-field">Cidade</label>
        <input type="text" id="cidade-field" placeholder="Cidade">
      </div>
      <div>
        <label for="estado-field">Estado</label>
        <input type="text" id="estado-field" placeholder="UF">
      </div>
    </div>

    <button type="button" class="save-btn" id="save-btn">Salvar meus dados</button>
    <p class="save-msg" id="save-msg">Dados salvos! ✓</p>
  </div>

<script>
const SUPABASE_URL = "https://htkvfujactojdejahrun.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_g3oZgj3D3YcZvW3werbYPA_Pv-_FNpL";
const session = JSON.parse(localStorage.getItem("sagradoSession") || "null");

function sbHeaders() {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
}

const profileNames = {
  citrico: "Cítrico", floral: "Floral", amadeirado: "Amadeirado", doce: "Doce",
  frutado: "Frutado", gourmand: "Gourmand", aquatico: "Aquático", especiado: "Especiado"
};

async function loadProfile() {
  const area = document.getElementById("perfil-aromatico-area");
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/users?email=eq." + encodeURIComponent(session.email), { headers: sbHeaders() });
    if (!res.ok) throw new Error("erro");
    const rows = await res.json();
    const user = rows[0] || {};

    document.getElementById("email-field").value = session.email;
    document.getElementById("nome-field").value = user.nome || "";
    document.getElementById("cpf-field").value = user.cpf || "";
    document.getElementById("cep-field").value = user.cep || "";
    document.getElementById("endereco-field").value = user.endereco || "";
    document.getElementById("cidade-field").value = user.cidade || "";
    document.getElementById("estado-field").value = user.estado || "";

    if (user.perfil_dominante) {
      area.innerHTML =
        '<div class="perfil-box">' +
          '<p><strong>Dominante:</strong> ' + (profileNames[user.perfil_dominante] || user.perfil_dominante) + '</p>' +
          (user.perfil_secundario ? '<p><strong>Secundário:</strong> ' + (profileNames[user.perfil_secundario] || user.perfil_secundario) + '</p>' : '') +
        '</div>';
    } else {
      area.innerHTML = '<p class="empty-perfil">Você ainda não fez o quiz de perfil aromático. <a href="quiz-corporal.html">Fazer agora →</a></p>';
    }
  } catch (err) {
    area.innerHTML = '<p class="empty-perfil">Não foi possível carregar seu perfil agora.</p>';
  }
}

document.getElementById("save-btn").addEventListener("click", async () => {
  const btn = document.getElementById("save-btn");
  const saveMsg = document.getElementById("save-msg");
  btn.disabled = true;
  btn.textContent = "Salvando...";
  saveMsg.style.display = "none";

  const updates = {
    nome: document.getElementById("nome-field").value.trim(),
    cpf: document.getElementById("cpf-field").value.trim(),
    cep: document.getElementById("cep-field").value.trim(),
    endereco: document.getElementById("endereco-field").value.trim(),
    cidade: document.getElementById("cidade-field").value.trim(),
    estado: document.getElementById("estado-field").value.trim()
  };

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/users?email=eq." + encodeURIComponent(session.email), {
      method: "PATCH",
      headers: sbHeaders(),
      body: JSON.stringify(updates)
    });
    if (!res.ok) {
      const text = await res.text();
      alert("Não foi possível salvar: " + text.slice(0, 200));
    } else {
      saveMsg.style.display = "block";
    }
  } catch (err) {
    alert("Erro de rede: " + err.message);
  }
  btn.disabled = false;
  btn.textContent = "Salvar meus dados";
});

if (!session) {
  window.location.href = "auth.html";
} else {
  loadProfile();
}
</script>
</body>
</html>
