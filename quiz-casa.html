<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagrado de Mim — Aroma para Casa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at 30% 20%, #f6efe6, #ece0cf);
    font-family: Georgia, 'Liberation Serif', serif;
    color: #332f28;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fbf7f0;
    border: 1px solid rgba(61,58,52,0.25);
    border-radius: 18px;
    max-width: 560px;
    width: 100%;
    padding: 40px 36px;
    box-shadow: 0 10px 30px rgba(61,58,52,0.08);
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand h1 { font-size: 26px; letter-spacing: 4px; margin: 0; font-weight: normal; }
  .brand p {
    font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 2px;
    color: #5f6b52; margin: 6px 0 0; text-transform: uppercase;
  }
  .progress { display: flex; gap: 6px; margin-bottom: 28px; }
  .progress div { flex: 1; height: 4px; border-radius: 2px; background: #e3dbca; transition: background 0.3s; }
  .progress div.done { background: #7d9169; }
  .question { font-family: Arial, sans-serif; font-size: 17px; font-weight: 600; margin-bottom: 18px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    font-family: Arial, sans-serif; text-align: left; padding: 14px 18px; border-radius: 10px;
    border: 1px solid rgba(61,58,52,0.25); background: #ffffff; color: #332f28; font-size: 15px;
    cursor: pointer; transition: all 0.15s;
  }
  .option:hover { border-color: #7d9169; background: #f2efe5; }
  .result-title {
    font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #8a8676; margin: 0 0 14px;
  }
  .profile-card {
    display: flex; gap: 14px; align-items: flex-start; border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px; background: #eef1e6;
  }
  .profile-icon { font-size: 26px; line-height: 1; margin-top: 2px; }
  .profile-name { font-family: Arial, sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 4px; color: #556238; }
  .profile-desc { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.55; margin: 0; color: #4a463e; }
  .restart {
    font-family: Arial, sans-serif; width: 100%; padding: 13px; border-radius: 10px;
    border: 1px solid rgba(61,58,52,0.3); background: transparent; color: #332f28; font-size: 14px; cursor: pointer; margin-top: 8px;
  }
  .restart:hover { background: #f2efe5; }
  .hidden { display: none; }
  .format-card {
    border: 1px solid rgba(61,58,52,0.25); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px;
    cursor: pointer; transition: all 0.15s; background: #fff;
  }
  .format-card:hover { border-color: #556238; background: #f2efe5; }
  .format-title { font-family: Arial, sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .format-desc { font-family: Arial, sans-serif; font-size: 13px; color: #4a463e; margin: 0 0 6px; }
  .format-price { font-family: Arial, sans-serif; font-weight: 700; color: #556238; margin: 0; }
  .name-input {
    width: 100%; font-family: Arial, sans-serif; font-size: 15px; padding: 12px 14px;
    border-radius: 10px; border: 1px solid rgba(61,58,52,0.3); margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <p style="text-align:center; margin-bottom:14px;"><a href="index.html" style="font-family:Arial,sans-serif; font-size:12px; color:#8a8676; text-decoration:none;">&larr; Voltar para o início</a></p>
    <div class="brand">
      <h1>AROMA PARA CASA</h1>
      <p>Descubra e personalize o aroma do seu lar</p>
    </div>

    <div id="progress" class="progress"></div>
    <div id="quiz-area"></div>
    <div id="result-area" class="hidden"></div>
  </div>

<script>
const aromas = {
  bambu: { nome: "Bambu com Trouss", icon: "🎋", cor: "#556238",
    desc: "Fresco e revigorante, traz uma energia natural e concentrada pro ambiente." },
  chabranco: { nome: "Chá Branco", icon: "🍵", cor: "#8a8676",
    desc: "Leve e sofisticado, deixa o ar limpo com uma elegância discreta." },
  aveiamel: { nome: "Aveia e Mel", icon: "🍯", cor: "#c9932e",
    desc: "Doce e aconchegante, envolve o ambiente numa sensação de conforto." },
  lavanda: { nome: "Lavanda", icon: "💜", cor: "#8b5fa8",
    desc: "Calmo e relaxante, ideal pra desacelerar e descansar." },
  neroli: { nome: "Neroli", icon: "🌸", cor: "#e08a2e",
    desc: "Floral amadeirado, traz sofisticação e um toque romântico." },
  chaverde: { nome: "Chá Verde", icon: "🌿", cor: "#5f8a5f",
    desc: "Energizante e revigorante, perfeito pra começar bem o dia." }
};

const questions = [
  {
    texto: "Qual dessas palavras mais combina com o ambiente que você quer criar?",
    opcoes: [
      { label: "Fresco e natural", key: "bambu" },
      { label: "Leve e sofisticado", key: "chabranco" },
      { label: "Doce e aconchegante", key: "aveiamel" },
      { label: "Calmo e relaxante", key: "lavanda" },
      { label: "Romântico e elegante", key: "neroli" },
      { label: "Energético e revigorante", key: "chaverde" }
    ]
  },
  {
    texto: "Qual desses momentos mais representa seu lar?",
    opcoes: [
      { label: "Manhã de trabalho focado", key: "bambu" },
      { label: "Tarde tranquila lendo", key: "chabranco" },
      { label: "Noite aconchegante em casa", key: "aveiamel" },
      { label: "Hora de relaxar e dormir", key: "lavanda" },
      { label: "Um jantar especial", key: "neroli" },
      { label: "Início disposto de um novo dia", key: "chaverde" }
    ]
  },
  {
    texto: "Qual elemento representa seu estilo de decoração?",
    opcoes: [
      { label: "Fibras naturais e bambu", key: "bambu" },
      { label: "Linho e tons claros", key: "chabranco" },
      { label: "Madeira e tecidos macios", key: "aveiamel" },
      { label: "Tons pastel e almofadas", key: "lavanda" },
      { label: "Veludo e detalhes dourados", key: "neroli" },
      { label: "Plantas e verde por toda parte", key: "chaverde" }
    ]
  },
  {
    texto: "O que você mais busca num ambiente perfumado?",
    opcoes: [
      { label: "Sensação de limpeza e frescor", key: "bambu" },
      { label: "Sofisticação discreta", key: "chabranco" },
      { label: "Aconchego e conforto", key: "aveiamel" },
      { label: "Relaxamento e calma", key: "lavanda" },
      { label: "Romantismo e charme", key: "neroli" },
      { label: "Energia e disposição", key: "chaverde" }
    ]
  },
  {
    texto: "Que tipo de música combina com o clima que você quer em casa?",
    opcoes: [
      { label: "Lo-fi ou sons da natureza", key: "bambu" },
      { label: "Jazz sofisticado", key: "chabranco" },
      { label: "Acústico e aconchegante", key: "aveiamel" },
      { label: "Instrumental relaxante", key: "lavanda" },
      { label: "Clássica romântica", key: "neroli" },
      { label: "Eletrônica animada", key: "chaverde" }
    ]
  }
];

let current = 0;
let scores = {};
let aromaNome = "";

function renderProgress() {
  const progress = document.getElementById("progress");
  progress.innerHTML = questions.map((_, i) => '<div class="' + (i < current ? "done" : "") + '"></div>').join('');
}

function renderQuestion() {
  renderProgress();
  const q = questions[current];
  const quizArea = document.getElementById("quiz-area");
  quizArea.innerHTML =
    '<p class="question">' + q.texto + '</p>' +
    '<div class="options">' +
    q.opcoes.map((o, idx) => '<button type="button" class="option" data-idx="' + idx + '">' + o.label + '</button>').join('') +
    '</div>';

  quizArea.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      const opcao = q.opcoes[parseInt(btn.dataset.idx)];
      scores[opcao.key] = (scores[opcao.key] || 0) + 1;
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        renderPerfilResult();
      }
    });
  });
}

function renderPerfilResult() {
  document.getElementById("progress").classList.add("hidden");
  document.getElementById("quiz-area").classList.add("hidden");
  const resultArea = document.getElementById("result-area");
  resultArea.classList.remove("hidden");

  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const topKey = sorted[0][0];
  const aroma = aromas[topKey];

  resultArea.innerHTML =
    '<p class="result-title">Seu perfil aromático pra casa</p>' +
    '<div class="profile-card">' +
      '<div class="profile-icon">' + aroma.icon + '</div>' +
      '<div><p class="profile-name" style="color:' + aroma.cor + ';">' + aroma.nome + '</p>' +
      '<p class="profile-desc">' + aroma.desc + '</p></div>' +
    '</div>' +
    '<p class="result-title" style="margin-top:22px;">Dê um nome ao seu aroma</p>' +
    '<input type="text" id="aroma-name-input" class="name-input" placeholder="Ex: Manhã de Domingo, Refúgio...">' +
    '<button type="button" class="restart" id="continue-formato-btn" style="border-color:#556238; color:#556238; font-weight:700;">Continuar →</button>' +
    '<button type="button" class="restart" id="restart-btn">Refazer o quiz</button>';

  document.getElementById("continue-formato-btn").addEventListener("click", () => {
    aromaNome = document.getElementById("aroma-name-input").value.trim() || aroma.nome;
    renderFormatoResult(aroma);
  });

  document.getElementById("restart-btn").addEventListener("click", () => {
    current = 0;
    scores = {};
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    resultArea.classList.add("hidden");
    renderQuestion();
  });
}

function renderFormatoResult(aroma) {
  const resultArea = document.getElementById("result-area");
  resultArea.innerHTML =
    '<p class="result-title">Seu aroma: ' + aromaNome + '</p>' +
    '<div class="profile-card">' +
      '<div class="profile-icon">' + aroma.icon + '</div>' +
      '<div><p class="profile-name" style="color:' + aroma.cor + ';">Base: ' + aroma.nome + '</p>' +
      '<p class="profile-desc">' + aroma.desc + '</p></div>' +
    '</div>' +
    '<p class="result-title" style="margin-top:22px;">Escolha o formato</p>' +
    '<div class="format-card" id="format-difusor">' +
      '<p class="format-title">Difusor de Varetas</p>' +
      '<p class="format-desc">Perfuma o ambiente de forma contínua e delicada.</p>' +
      '<p class="format-price">R$ 175,00</p>' +
    '</div>' +
    '<div class="format-card" id="format-spray">' +
      '<p class="format-title">Home Spray</p>' +
      '<p class="format-desc">Borrifa e perfuma instantaneamente o ambiente.</p>' +
      '<p class="format-price">R$ 85,00</p>' +
    '</div>' +
    '<button type="button" class="restart" id="restart-btn2">Refazer o quiz</button>';

  document.getElementById("format-difusor").addEventListener("click", () => adicionarAoCarrinho("Difusor de Varetas", 175, aromaNome, aroma.nome));
  document.getElementById("format-spray").addEventListener("click", () => adicionarAoCarrinho("Home Spray", 85, aromaNome, aroma.nome));

  document.getElementById("restart-btn2").addEventListener("click", () => {
    current = 0;
    scores = {};
    aromaNome = "";
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    renderQuestion();
  });
}

function adicionarAoCarrinho(tipo, preco, nomeAroma, baseAroma) {
  const cart = JSON.parse(localStorage.getItem("sagradoCart") || "[]");
  cart.push({ tipo: tipo, preco: preco, detalhes: { "Nome do aroma": nomeAroma, "Base aromática": baseAroma } });
  localStorage.setItem("sagradoCart", JSON.stringify(cart));
  window.location.href = "carrinho.html";
}

renderQuestion();
</script>
</body>
</html>
