<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/logo-cursiva.png">
<meta name="description" content="Loja Sagrado de Mim — difusores, home sprays, velas, hidratantes, sabonetes e cosméticos artesanais.">
<title>Sagrado de Mim — Loja</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 60px;
    background: radial-gradient(circle at 30% 20%, #f6efe6, #ece0cf);
    font-family: Georgia, 'Liberation Serif', serif;
    color: #332f28;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .back-link { display:block; text-align:center; font-family:Arial,sans-serif; font-size:12px; color:#8a8676; text-decoration:none; margin-bottom:12px; }
  .top-nav { display:flex; justify-content:center; gap:18px; margin-bottom:18px; font-family:Arial,sans-serif; font-size:12px; }
  .top-nav a { color:#8a8676; text-decoration:none; }
  h1 { font-size: 26px; letter-spacing: 4px; text-align:center; margin: 0 0 6px; font-weight: normal; }
  .sub { font-family:Arial,sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#5f6b52; text-align:center; margin:0 0 28px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px; }
  .chip {
    font-family: Arial, sans-serif; font-size: 13px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid rgba(61,58,52,0.25); background: #fff; color: #332f28; cursor: pointer;
  }
  .chip.active { background: #556238; color: #fff; border-color: #556238; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .product {
    background: #fbf7f0; border: 1px solid rgba(61,58,52,0.18); border-radius: 16px; overflow: hidden;
    display:flex; flex-direction:column; box-shadow: 0 6px 18px rgba(61,58,52,0.06);
  }
  .photo { width:100%; aspect-ratio: 1 / 1; background:#f1e8da; display:flex; align-items:center; justify-content:center; }
  .photo img.real { width:100%; height:100%; object-fit:cover; display:block; }
  .photo img.placeholder { width:46%; opacity:0.35; }
  .info { padding: 16px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .cat { font-family:Arial,sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#8a8676; margin:0 0 6px; }
  .name { font-size: 18px; margin: 0 0 4px; line-height:1.25; }
  .size { font-family:Arial,sans-serif; font-size:12px; color:#6b6558; margin:0 0 10px; }
  .info .status { margin-top:auto; }
  .price { font-family:Arial,sans-serif; font-weight:700; font-size:17px; color:#556238; margin: 0 0 10px; }
  select.aroma {
    width:100%; font-family:Arial,sans-serif; font-size:13px; padding:9px 10px; border-radius:8px;
    border:1px solid rgba(61,58,52,0.3); margin-bottom:10px; background:#fff;
  }
  .add-btn {
    width:100%; font-family:Arial,sans-serif; font-weight:700; font-size:14px; background:#556238; color:#fff;
    padding:12px; border-radius:10px; border:none; cursor:pointer;
  }
  .status { font-family:Arial,sans-serif; font-size:12px; color:#6b6558; margin:0 0 6px; min-height:16px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.ok { background:#6a9a4a; }
  .dot.enc { background:#d9a23a; }
  #toast {
    position: fixed; left:50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
    background:#332f28; color:#fff; font-family:Arial,sans-serif; font-size:14px; padding:14px 20px; border-radius:12px;
    transition: all .25s; z-index: 50; display:flex; gap:14px; align-items:center;
  }
  #toast.show { opacity:1; transform: translateX(-50%) translateY(0); pointer-events:auto; }
  #toast a { color:#d9e4c4; font-weight:700; text-decoration:none; }
</style>
<script src="assets/topbar.js" defer></script>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back-link">&larr; Voltar para o início</a>
    <h1>LOJA</h1>
    <p class="sub">Feito à mão, pensado para você</p>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="toast"><span id="toast-text">Adicionado ao carrinho</span><a href="carrinho.html">Ver carrinho →</a></div>

<script src="produtos.js"></script>
<script>
const SUPABASE_URL = "https://htkvfujactojdejahrun.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_g3oZgj3D3YcZvW3werbYPA_Pv-_FNpL";

// ESTOQUE: mapa "produto|aroma" -> quantidade. null = nao foi possivel ler (a loja continua funcionando, sem status).
let ESTOQUE = null;

async function carregarEstoque() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(SUPABASE_URL + "/rest/v1/stock?select=product_id,aroma,estoque", {
      headers: { "apikey": SUPABASE_ANON_KEY }, signal: ctrl.signal
    });
    clearTimeout(t);
    if (!res.ok) return;
    const rows = await res.json();
    ESTOQUE = {};
    rows.forEach(r => { ESTOQUE[r.product_id + "|" + r.aroma] = r.estoque; });
  } catch (e) { /* sem estoque: segue sem status */ }
}

function qtdEstoque(id, aroma) {
  if (ESTOQUE === null) return null;
  return ESTOQUE[id + "|" + (aroma || "")] || 0;
}

function statusHtml(qtd) {
  if (qtd === null) return "";
  return qtd > 0
    ? '<span class="dot ok"></span>Pronta entrega'
    : '<span class="dot enc"></span>Sob encomenda · 5 dias de produção';
}

const CATEGORIAS = ["Todos", "Perfumaria & Ambiente", "Perfumaria Pessoal", "Corpo", "Banho & Facial"];
let categoriaAtiva = "Todos";

function brl(v) { return "R$ " + v.toFixed(2).replace(".", ","); }

function renderFiltros() {
  const el = document.getElementById("filters");
  el.innerHTML = CATEGORIAS.map(c =>
    '<button type="button" class="chip' + (c === categoriaAtiva ? ' active' : '') + '" data-cat="' + c + '">' + c + '</button>'
  ).join('');
  el.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      categoriaAtiva = btn.dataset.cat;
      renderFiltros();
      renderGrid();
    });
  });
}

function renderGrid() {
  const lista = PRODUTOS.filter(p => categoriaAtiva === "Todos" || p.cat === categoriaAtiva);
  const grid = document.getElementById("grid");
  grid.innerHTML = lista.map(p => {
    const foto = p.img
      ? '<img class="real" src="' + p.img + '" alt="' + p.nome + '" loading="lazy">'
      : '<img class="placeholder" src="assets/logo-cursiva.png" alt="">';
    let aroma = "";
    let status = "";
    if (p.aroma) {
      aroma = '<select class="aroma" data-id="' + p.id + '"><option value="">Escolha o aroma...</option>' +
        AROMAS.map(a => {
          const q = qtdEstoque(p.id, a);
          const rotulo = q === null ? a : a + (q > 0 ? " · pronta entrega" : " · sob encomenda");
          return '<option value="' + a + '">' + rotulo + '</option>';
        }).join('') + '</select>';
      status = ESTOQUE === null ? "" : "Escolha o aroma para ver a disponibilidade";
    } else {
      status = statusHtml(qtdEstoque(p.id, ""));
    }
    return '<div class="product">' +
      '<div class="photo">' + foto + '</div>' +
      '<div class="info">' +
        '<p class="cat">' + p.cat + '</p>' +
        '<p class="name">' + p.nome + '</p>' +
        '<p class="size">' + (p.tamanho || "&nbsp;") + '</p>' +
        '<p class="status" data-status-id="' + p.id + '">' + status + '</p>' +
        '<p class="price">' + brl(p.preco) + '</p>' +
        aroma +
        '<button type="button" class="add-btn" data-id="' + p.id + '">Adicionar ao carrinho</button>' +
      '</div></div>';
  }).join('');

  grid.querySelectorAll(".add-btn").forEach(btn => {
    btn.addEventListener("click", () => adicionar(btn.dataset.id));
  });
  grid.querySelectorAll("select.aroma").forEach(sel => {
    sel.addEventListener("change", () => {
      const id = sel.dataset.id;
      const el = document.querySelector('[data-status-id="' + id + '"]');
      if (!el) return;
      el.innerHTML = sel.value ? statusHtml(qtdEstoque(id, sel.value)) : (ESTOQUE === null ? "" : "Escolha o aroma para ver a disponibilidade");
    });
  });
}

function adicionar(id) {
  const p = PRODUTOS.find(x => x.id === id);
  const detalhes = {};
  if (p.tamanho) detalhes["Tamanho"] = p.tamanho;
  let aromaSel = "";
  if (p.aroma) {
    const sel = document.querySelector('select.aroma[data-id="' + id + '"]');
    if (!sel || !sel.value) {
      alert("Escolha um aroma antes de adicionar ao carrinho.");
      return;
    }
    aromaSel = sel.value;
    detalhes["Aroma"] = aromaSel;
  }
  const cart = JSON.parse(localStorage.getItem("sagradoCart") || "[]");

  // Se ja existem unidades iguais no carrinho, elas contam no estoque antes desta.
  const q = qtdEstoque(p.id, aromaSel);
  if (q !== null) {
    const jaNoCarrinho = cart.filter(i => i.produtoId === p.id && (i.aromaEstoque || "") === aromaSel).length;
    detalhes["Entrega"] = jaNoCarrinho < q ? "Pronta entrega" : "Sob encomenda — 5 dias de produção";
  }

  cart.push({ tipo: p.nome, preco: p.preco, detalhes: detalhes, produtoId: p.id, aromaEstoque: aromaSel });
  localStorage.setItem("sagradoCart", JSON.stringify(cart));

  const toast = document.getElementById("toast");
  document.getElementById("toast-text").textContent = p.nome + " adicionado ao carrinho";
  toast.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
}

carregarEstoque().then(() => { renderFiltros(); renderGrid(); });
</script>
</body>
</html>
