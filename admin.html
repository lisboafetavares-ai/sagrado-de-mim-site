<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagrado de Mim — Painel da Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital@1&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Liberation Serif', serif;
    background: radial-gradient(circle at 30% 20%, #f6efe6, #ece0cf);
    color: #332f28;
    min-height: 100vh;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; border-bottom: 1px solid rgba(61,58,52,0.15);
  }
  .top-bar h1 { font-size: 20px; letter-spacing: 2px; margin: 0; font-weight: normal; }
  .top-bar a { font-family: Arial, sans-serif; font-size: 13px; color: #556238; text-decoration: none; font-weight: 700; margin-left: 18px; }
  .layout { display: flex; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 70px); }
  .sidebar {
    width: 320px; flex-shrink: 0; border-right: 1px solid rgba(61,58,52,0.15);
    padding: 20px; overflow-y: auto;
  }
  .sidebar-item {
    font-family: Arial, sans-serif; padding: 14px 16px; border-radius: 10px; cursor: pointer;
    margin-bottom: 8px; border: 1px solid rgba(61,58,52,0.15); background: #fbf7f0;
  }
  .sidebar-item.active { border-color: #556238; background: #eef1e6; }
  .sidebar-item .code { font-weight: 700; font-size: 14px; }
  .sidebar-item .meta { font-size: 12px; color: #8a8676; margin-top: 4px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.pendente { background: #a3455a; }
  .status-dot.confirmado { background: #556238; }
  .main-panel { flex: 1; padding: 32px 40px; }
  label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; margin-top: 18px; }
  input[type="text"], select {
    width: 100%; font-family: Arial, sans-serif; font-size: 15px; padding: 12px 14px;
    border-radius: 8px; border: 1px solid rgba(61,58,52,0.3);
  }
  .btn {
    font-family: Arial, sans-serif; font-weight: 700; font-size: 15px;
    background: #556238; color: #fff; padding: 14px 22px; border-radius: 10px; border: none; cursor: pointer;
  }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .save-msg { font-size: 13px; color: #556238; margin-top: 8px; display: none; }
  .empty { font-family: Arial, sans-serif; text-align: center; color: #8a8676; padding: 60px 20px; font-size: 15px; }
  .label-img { max-width: 340px; border: 1px solid rgba(61,58,52,0.2); border-radius: 8px; margin: 12px 0; display: block; }
  .order-title { font-size: 26px; margin: 0 0 6px; }
  .order-meta { font-family: Arial, sans-serif; font-size: 14px; color: #4a463e; margin: 0 0 20px; }
  .item-block { border-top: 1px solid rgba(61,58,52,0.15); padding-top: 16px; margin-top: 16px; }
  .item-title { font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; margin: 0 0 4px; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>PAINEL DA LOJA</h1>
    <div>
      <a href="index.html">Ver loja</a>

  <div style="display:flex; gap:10px; padding:14px 28px 0; border-bottom:1px solid rgba(61,58,52,0.1);">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const SUPABASE_URL = "https://htkvfujactojdejahrun.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_g3oZgj3D3YcZvW3werbYPA_Pv-_FNpL";
const session = JSON.parse(localStorage.getItem("sagradoSession") || "null");
let ordersCache = {};
let activeCode = null;

function sbHeaders() {
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
}

async function fetchAllOrders() {
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/orders?order=data.desc", {
      headers: sbHeaders()
    });
    if (!res.ok) return {};
    const rows = await res.json();
    const map = {};
    rows.forEach(row => { map[row.order_code] = row; });
    return map;
  } catch (err) {
    return {};
  }
}

async function saveOrder(codigo, updates) {
  await fetch(SUPABASE_URL + "/rest/v1/orders?order_code=eq." + encodeURIComponent(codigo), {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify(updates)
  });
}

function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  const codes = Object.keys(ordersCache);
  if (codes.length === 0) {
    sidebar.innerHTML = '<p class="empty">Nenhum pedido ainda.</p>';
    return;
  }
  sidebar.innerHTML = codes.map(codigo => {
    const data = ordersCache[codigo];
    const isPago = (data.pagamento || "Pendente").toLowerCase().includes("confirmado");
    return '<div class="sidebar-item' + (codigo === activeCode ? ' active' : '') + '" data-codigo="' + codigo + '">' +
      '<div class="code"><span class="status-dot ' + (isPago ? 'confirmado' : 'pendente') + '"></span>' + codigo + '</div>' +
      '<div class="meta">' + (data.cliente || "—") + ' · R$ ' + (data.total ? Number(data.total).toFixed(2).replace('.',',') : "—") + '</div>' +
    '</div>';
  }).join('');

  sidebar.querySelectorAll(".sidebar-item").forEach(el => {
    el.addEventListener("click", () => {
      activeCode = el.dataset.codigo;
      renderSidebar();
      renderMainPanel(activeCode);
    });
  });
}

function renderMainPanel(codigo) {
  const data = ordersCache[codigo];
  const main = document.getElementById("main-panel");

  const itensHtml = (data.itens || []).map((item, idx) => {
    const imgHtml = item.etiquetaImg
      ? '<img src="' + item.etiquetaImg + '" class="label-img" alt="Etiqueta">' +
        '<a href="' + item.etiquetaImg + '" download="etiqueta-' + codigo + '.png" class="btn" style="display:inline-block; margin-top:8px; font-size:13px; padding:8px 14px; text-decoration:none;">Baixar imagem da etiqueta</a>'
      : '';
    const detalhesHtml = Object.entries(item.detalhes || {}).map(([k,v]) =>
      '<p style="margin:2px 0; font-size:13px;"><strong>' + k + ':</strong> ' + v + '</p>'
    ).join('');
    const nomeDoPerfume = (item.detalhes || {})["Nome do perfume"];
    const regenBtn = nomeDoPerfume
      ? '<button type="button" class="btn regen-label-btn" data-idx="' + idx + '" data-nome="' + nomeDoPerfume.replace(/"/g,'&quot;') + '" style="margin-top:8px; margin-left:8px; font-size:13px; padding:8px 14px; background:#8a8676;">Atualizar etiqueta (versão mais nítida)</button>'
      : '';
    return '<div class="item-block">' +
      '<p class="item-title">' + item.tipo + ' — R$ ' + Number(item.preco).toFixed(2).replace('.',',') + '</p>' +
      detalhesHtml +
      imgHtml +
      regenBtn +
    '</div>';
  }).join('');

  const enderecoCompleto = [data.endereco, data.cidade, data.estado, data.cep].filter(Boolean).join(' · ');
  const reviewHtml = data.avaliacao_nota
    ? '<p class="order-meta" style="margin-top:-14px; color:#c9a24a;">Avaliação: ' + '★'.repeat(data.avaliacao_nota) + '☆'.repeat(5 - data.avaliacao_nota) + (data.avaliacao_comentario ? ' — "' + data.avaliacao_comentario + '"' : '') + '</p>'
    : '';

  const pedidosDesseEmail = Object.values(ordersCache).filter(o => o.email === data.email).length;
  const isPrimeiraCompra = pedidosDesseEmail <= 1;
  const primeiraCompraHtml = isPrimeiraCompra
    ? '<p style="background:#eef1e6; color:#556238; font-family:Arial,sans-serif; font-weight:700; font-size:13px; padding:10px 14px; border-radius:8px; margin:8px 0;">🎁 Primeira compra dessa cliente — inclua a amostra de boas-vindas!</p>'
    : '';

  main.innerHTML =
    '<p class="order-title">' + codigo + '</p>' +
    '<p class="order-meta">Cliente: ' + (data.cliente || "—") + ' · E-mail: ' + (data.email || "—") + ' · Total: R$ ' + (data.total ? Number(data.total).toFixed(2).replace('.',',') : "—") + '</p>' +
    (enderecoCompleto ? '<p class="order-meta" style="margin-top:-14px;">Endereço: ' + enderecoCompleto + '</p>' : '') +
    primeiraCompraHtml +
    reviewHtml +
    itensHtml +
    '<div class="row" style="margin-top:20px;">' +
      '<div>' +
        '<label>Pagamento</label>' +
        '<select class="f-pagamento">' +
          '<option value="Pendente"' + (data.pagamento === "Pendente" ? " selected" : "") + '>Pendente</option>' +
          '<option value="Confirmado"' + (data.pagamento === "Confirmado" ? " selected" : "") + '>Confirmado</option>' +
        '</select>' +
      '</div>' +
      '<div>' +
        '<label>Envio</label>' +
        '<select class="f-envio">' +
          '<option value="Pedido confirmado"' + (data.envio === "Pedido confirmado" ? " selected" : "") + '>Pedido confirmado</option>' +
          '<option value="Em produção"' + (data.envio === "Em produção" ? " selected" : "") + '>Em produção</option>' +
          '<option value="Embalado"' + (data.envio === "Embalado" ? " selected" : "") + '>Embalado</option>' +
          '<option value="Postado"' + (data.envio === "Postado" ? " selected" : "") + '>Postado</option>' +
        '</select>' +
      '</div>' +
    '</div>' +
    '<label>Transportadora</label>' +
    '<input type="text" class="f-transportadora" value="' + (data.transportadora || "") + '" placeholder="Ex: Correios, Jadlog...">' +
    '<label>Código de rastreio</label>' +
    '<input type="text" class="f-rastreio" value="' + (data.rastreio || "") + '" placeholder="Ex: BR123456789BR">' +
    '<div style="margin-top:20px;">' +
      '<button type="button" class="btn" id="save-btn">Salvar</button>' +
      '<p class="save-msg" id="save-msg">Salvo!</p>' +
    '</div>';

  document.getElementById("save-btn").addEventListener("click", async () => {
    const updates = {
      pagamento: main.querySelector(".f-pagamento").value,
      envio: main.querySelector(".f-envio").value,
      transportadora: main.querySelector(".f-transportadora").value.trim(),
      rastreio: main.querySelector(".f-rastreio").value.trim()
    };
    await saveOrder(codigo, updates);
    ordersCache[codigo] = { ...data, ...updates };
    document.getElementById("save-msg").style.display = "block";
    setTimeout(() => { document.getElementById("save-msg").style.display = "none"; }, 2000);
    renderSidebar();
  });

  main.querySelectorAll(".regen-label-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Gerando...";
      try {
        const idx = parseInt(btn.dataset.idx);
        const item = (data.itens || [])[idx];
        const newUrl = await regenerateLabel(btn.dataset.nome, item.iconsPosicionados || []);
        const updatedItens = [...(data.itens || [])];
        updatedItens[idx] = { ...updatedItens[idx], etiquetaImg: newUrl };
        await saveOrder(codigo, { itens: updatedItens });
        ordersCache[codigo] = { ...data, itens: updatedItens };
        renderMainPanel(codigo);
      } catch (err) {
        alert("Não foi possível atualizar a etiqueta: " + err.message);
        btn.disabled = false;
        btn.textContent = "Atualizar etiqueta (versão mais nítida)";
      }
    });
  });
}

const CLOUDINARY_CLOUD_NAME = "ld4xgnhw";
const CLOUDINARY_UPLOAD_PRESET = "vb70iaep";

async function regenerateLabel(perfumeName, iconsPosicionados) {
  const placedHtml = (iconsPosicionados || []).map(p =>
    '<span style="position:absolute; left:' + p.xPct + '%; top:' + p.yPct + '%; transform:translate(-50%,-50%); font-size:26px; color:#556238;">' + p.char + '</span>'
  ).join('');

  const holder = document.createElement("div");
  holder.style.position = "fixed";
  holder.style.left = "-9999px";
  holder.style.top = "0";

  holder.innerHTML =
    '<div id="regen-canvas" style="position:relative; background:#fdfbf7; border:1px solid rgba(61,58,52,0.3); border-radius:6px; padding:9px 10px; box-sizing:border-box; width:325px; height:170px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
      '<div style="position:relative; width:48px; height:150px; flex-shrink:0;">' +
        '<div style="position:absolute; top:50%; left:50%; width:150px; height:48px; transform:translate(-50%,-50%) rotate(-90deg); font-family:Arial,sans-serif; font-weight:700; font-size:7px; line-height:1.35; color:#000000; display:flex; align-items:center;">' +
          '<span><strong>PERFUME</strong> — Composição: Álcool de Cereais, Essência, Glicerina Bidestilada, Extrato Glicerinado, Água Mineral e Corante Cosmético. NÃO INGERIR. EVITAR CONTATO COM OS OLHOS. USO EXTERNO. <strong>PRODUTO ARTESANAL</strong> · Válido por 1 ano</span>' +
        '</div>' +
      '</div>' +
      '<div style="flex:1; text-align:center;">' +
        '<p style="font-family:Georgia,serif; font-weight:700; font-size:14px; letter-spacing:1.5px; margin:0 0 3px; color:#000000;">SAGRADO DE MIM</p>' +
        '<p style="font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:8px; margin:0 0 6px; color:#3d4a33;">uma fragrância feita para você</p>' +
        '<p style="font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:19px; margin:0; color:#000000;">' + perfumeName + '</p>' +
      '</div>' +
      placedHtml +
    '</div>';
  document.body.appendChild(holder);

  const canvasEl = document.getElementById("regen-canvas");
  const canvas = await html2canvas(canvasEl, { backgroundColor: "#fdfbf7", scale: 5 });
  document.body.removeChild(holder);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  const formData = new FormData();
  formData.append("file", blob);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
    method: "POST",
    body: formData
  });
  const uploadData = await res.json();
  if (!uploadData.secure_url) throw new Error("Falha no upload da imagem");
  return uploadData.secure_url;
}
async function loadAll() {
  ordersCache = await fetchAllOrders();
  const codes = Object.keys(ordersCache);
  renderSidebar();
  if (codes.length > 0) {
    activeCode = codes[0];
    renderSidebar();
    renderMainPanel(activeCode);
  }
}

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  localStorage.removeItem("sagradoSession");
  window.location.href = "auth.html";
});

document.getElementById("tab-pedidos").addEventListener("click", () => {
  document.getElementById("view-pedidos").style.display = "flex";
  document.getElementById("view-etiqueta").style.display = "none";
  document.getElementById("tab-pedidos").style.background = "#556238";
  document.getElementById("tab-pedidos").style.color = "#fff";
  document.getElementById("tab-etiqueta").style.background = "#eef1e6";
  document.getElementById("tab-etiqueta").style.color = "#556238";
});

document.getElementById("tab-etiqueta").addEventListener("click", () => {
  document.getElementById("view-pedidos").style.display = "none";
  document.getElementById("view-etiqueta").style.display = "block";
  document.getElementById("tab-etiqueta").style.background = "#556238";
  document.getElementById("tab-etiqueta").style.color = "#fff";
  document.getElementById("tab-pedidos").style.background = "#eef1e6";
  document.getElementById("tab-pedidos").style.color = "#556238";
  renderAtelierEditor();
});

// ---------- Editor de etiqueta pro ateliê ----------
const atelierIconOptions = [
  {id:"coracao", char:"♥"},
  {id:"coracao-vazio", char:"♡"},
  {id:"estrela", char:"★"},
  {id:"sol", char:"☼"},
  {id:"lua", char:"☾"},
  {id:"flor", char:"❀"},
  {id:"flor-fina", char:"✽"},
  {id:"infinito", char:"∞"},
  {id:"estrela-clara", char:"✩"}
];
let atelierPerfumeName = "";
const atelierFontOptions = [
  {id:"classico", label:"Clássico", family:"Georgia,serif", style:"italic", weight:"700"},
  {id:"script", label:"Script", family:"'Dancing Script',cursive", style:"normal", weight:"700"},
  {id:"elegante", label:"Elegante", family:"'Playfair Display',serif", style:"italic", weight:"400"},
  {id:"moderno", label:"Moderno", family:"'Montserrat',sans-serif", style:"normal", weight:"700"}
];
let atelierSelectedFont = atelierFontOptions[0];
let atelierPlacedIcons = [];
let atelierSelectedPaletteId = null;

function atelierRenderLabel(interactive) {
  const placedHtml = atelierPlacedIcons.map((p, idx) =>
    '<span class="atelier-placed-icon" data-idx="' + idx + '" style="position:absolute; left:' + p.xPct + '%; top:' + p.yPct + '%; transform:translate(-50%,-50%); font-size:26px; color:#556238; cursor:' + (interactive ? 'pointer' : 'default') + ';">' + p.char + '</span>'
  ).join('');

  return '<div id="atelier-label-canvas" style="position:relative; background:#fdfbf7; border:1px solid rgba(61,58,52,0.3); border-radius:6px; padding:9px 10px; box-sizing:border-box; width:325px; height:170px; display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto 20px; ' + (interactive ? 'cursor:crosshair;' : '') + '">' +
    '<div style="position:relative; width:48px; height:150px; flex-shrink:0; pointer-events:none;">' +
      '<div style="position:absolute; top:50%; left:50%; width:150px; height:48px; transform:translate(-50%,-50%) rotate(-90deg); font-family:Arial,sans-serif; font-weight:700; font-size:7px; line-height:1.35; color:#000000; display:flex; align-items:center;">' +
        '<span><strong>PERFUME</strong> — Composição: Álcool de Cereais, Essência, Glicerina Bidestilada, Extrato Glicerinado, Água Mineral e Corante Cosmético. NÃO INGERIR. EVITAR CONTATO COM OS OLHOS. USO EXTERNO. <strong>PRODUTO ARTESANAL</strong> · Válido por 1 ano</span>' +
      '</div>' +
    '</div>' +
    '<div style="flex:1; text-align:center; pointer-events:none;">' +
    '<p style="font-family:Georgia,serif; font-weight:700; font-size:14px; letter-spacing:1.5px; margin:0 0 3px; color:#000000;">SAGRADO DE MIM</p>' +
    '<p style="font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:8px; margin:0 0 6px; color:#3d4a33;">uma fragrância feita para você</p>' +
    '<p style="font-family:' + atelierSelectedFont.family + '; font-style:' + atelierSelectedFont.style + '; font-weight:' + atelierSelectedFont.weight + '; font-size:19px; margin:0; color:#000000;">' + (atelierPerfumeName || "Nome do perfume") + '</p>' +
    '</div>' +
    placedHtml +
  '</div>';
}

function renderAtelierEditor() {
  const container = document.getElementById("atelier-editor");
  container.innerHTML =
    '<div id="atelier-label-preview"></div>' +
    '<p style="font-family:Arial,sans-serif; font-size:13px; font-weight:700; margin:0 0 6px;">Nome do perfume</p>' +
    '<input type="text" id="atelier-name-input" placeholder="Ex: Encanto, Lua Nova..." style="width:100%; box-sizing:border-box; font-family:Arial,sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid rgba(61,58,52,0.3); margin-bottom:16px;">' +
    '<p style="font-family:Arial,sans-serif; font-size:13px; font-weight:700; margin:0 0 6px;">Estilo da letra do nome</p>' +
    '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">' +
    atelierFontOptions.map(f => '<button type="button" class="atelier-font-btn" data-id="' + f.id + '" style="padding:10px 16px; font-family:' + f.family + '; font-style:' + f.style + '; font-weight:' + f.weight + '; font-size:16px; border:1px solid ' + (f.id === atelierSelectedFont.id ? '#556238' : 'rgba(61,58,52,0.25)') + '; background:' + (f.id === atelierSelectedFont.id ? '#eef1e6' : '#fff') + '; border-radius:8px; cursor:pointer;">' + f.label + '</button>').join('') +
    '</div>' +
    '<p style="font-family:Arial,sans-serif; font-size:13px; font-weight:700; margin:0 0 6px;">Escolha um elemento e clique na etiqueta pra posicioná-lo</p>' +
    '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">' +
    atelierIconOptions.map(o => '<button type="button" class="atelier-icon-palette" data-id="' + o.id + '" style="padding:10px 16px; font-size:22px; color:#556238; border:1px solid rgba(61,58,52,0.25); border-radius:8px; background:#fff; cursor:pointer;">' + o.char + '</button>').join('') +
    '</div>' +
    '<button type="button" id="atelier-download-btn" style="width:100%; font-family:Arial,sans-serif; font-weight:700; font-size:15px; background:#556238; color:#fff; padding:14px; border-radius:10px; border:none; cursor:pointer;">Baixar etiqueta</button>';

  const updateAtelierPreview = () => {
    document.getElementById("atelier-label-preview").innerHTML = atelierRenderLabel(true);
    attachAtelierCanvasEvents();
  };

  function attachAtelierCanvasEvents() {
    const canvas = document.getElementById("atelier-label-canvas");
    canvas.addEventListener("click", (e) => {
      if (e.target.classList.contains("atelier-placed-icon")) return;
      if (!atelierSelectedPaletteId) return;
      const rect = canvas.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      const iconDef = atelierIconOptions.find(o => o.id === atelierSelectedPaletteId);
      atelierPlacedIcons.push({ char: iconDef.char, xPct, yPct });
      updateAtelierPreview();
    });
    canvas.querySelectorAll(".atelier-placed-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = parseInt(el.dataset.idx);
        atelierPlacedIcons.splice(idx, 1);
        updateAtelierPreview();
      });
    });
  }

  document.getElementById("atelier-name-input").addEventListener("input", (e) => {
    atelierPerfumeName = e.target.value;
    updateAtelierPreview();
  });

  container.querySelectorAll(".atelier-font-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      atelierSelectedFont = atelierFontOptions.find(f => f.id === btn.dataset.id);
      container.querySelectorAll(".atelier-font-btn").forEach(b => { b.style.background = "#fff"; b.style.borderColor = "rgba(61,58,52,0.25)"; });
      btn.style.background = "#eef1e6";
      btn.style.borderColor = "#556238";
      updateAtelierPreview();
    });
  });

  container.querySelectorAll(".atelier-icon-palette").forEach(btn => {
    btn.addEventListener("click", () => {
      atelierSelectedPaletteId = btn.dataset.id;
      container.querySelectorAll(".atelier-icon-palette").forEach(b => { b.style.background = "#fff"; b.style.borderColor = "rgba(61,58,52,0.25)"; });
      btn.style.background = "#eef1e6";
      btn.style.borderColor = "#556238";
    });
  });

  document.getElementById("atelier-download-btn").addEventListener("click", async () => {
    const btn = document.getElementById("atelier-download-btn");
    btn.disabled = true;
    btn.textContent = "Gerando...";
    const canvasEl = document.getElementById("atelier-label-canvas");
    const canvas = await html2canvas(canvasEl, { backgroundColor: "#fdfbf7", scale: 5 });
    const link = document.createElement("a");
    link.download = "etiqueta-" + (atelierPerfumeName || "sagrado-de-mim").replace(/\s+/g, "-") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    btn.disabled = false;
    btn.textContent = "Baixar etiqueta";
  });

  updateAtelierPreview();
}

if (SUPABASE_URL.includes("COLE_AQUI")) {
  document.getElementById("main-panel").innerHTML = '<p class="empty">Este painel ainda não está conectado ao Supabase.</p>';
} else if (!session) {
  window.location.href = "auth.html";
} else if (!session.isAdmin) {
  window.location.href = "index.html";
} else {
  loadAll();
}
</script>
