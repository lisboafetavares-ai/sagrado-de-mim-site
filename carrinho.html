<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagrado de Mim — Carrinho</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at 30% 20%, #f6efe6, #ece0cf);
    font-family: Georgia, 'Liberation Serif', serif;
    color: #332f28;
    min-height: 100vh;
  }
  .card {
    background: #fbf7f0;
    border: 1px solid rgba(61,58,52,0.25);
    border-radius: 18px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    padding: 36px 32px;
    box-shadow: 0 10px 30px rgba(61,58,52,0.08);
  }
  h1 { font-size: 22px; letter-spacing: 2px; margin: 0 0 6px; font-weight: normal; text-align:center; }
  .back-link { display:block; text-align:center; font-family:Arial,sans-serif; font-size:12px; color:#8a8676; text-decoration:none; margin-bottom:14px; }
  .item {
    border: 1px solid rgba(61,58,52,0.2);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
    font-family: Arial, sans-serif;
  }
  .item-title { font-weight: 700; font-size: 15px; margin: 0 0 6px; }
  .item-detail { font-size: 13px; color: #4a463e; margin: 2px 0; }
  .item-price { font-weight: 700; color: #556238; margin-top: 8px; }
  .remove-btn {
    font-family: Arial, sans-serif; font-size: 12px; color: #a3455a;
    background: none; border: none; cursor: pointer; padding: 0; margin-top: 8px;
  }
  .totals { font-family: Arial, sans-serif; font-size: 14px; margin-top: 20px; border-top: 1px solid rgba(61,58,52,0.2); padding-top: 16px; }
  .totals p { display: flex; justify-content: space-between; margin: 6px 0; }
  .totals .grand { font-weight: 700; font-size: 17px; color: #332f28; margin-top: 10px; }
  .checkout-btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font-family: Arial, sans-serif; font-weight: 700; font-size: 15px;
    background: #556238; color: #fff; padding: 14px; border-radius: 10px; margin-top: 20px;
  }
  .empty { font-family: Arial, sans-serif; text-align: center; color: #8a8676; padding: 30px 0; }
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">&larr; Voltar para o início</a>
    <h1>SEU CARRINHO</h1>
    <div id="cart-items"></div>
    <div id="totals-area"></div>
  </div>

<script>
function loadCart() {
  return JSON.parse(localStorage.getItem("sagradoCart") || "[]");
}
function saveCart(cart) {
  localStorage.setItem("sagradoCart", JSON.stringify(cart));
}

function render() {
  const cart = loadCart();
  const itemsArea = document.getElementById("cart-items");
  const totalsArea = document.getElementById("totals-area");

  if (cart.length === 0) {
    itemsArea.innerHTML = '<p class="empty">Seu carrinho está vazio.</p>';
    totalsArea.innerHTML = '';
    return;
  }

  itemsArea.innerHTML = cart.map((item, idx) => {
    const details = Object.entries(item.detalhes || {}).map(([k,v]) => '<p class="item-detail"><strong>' + k + ':</strong> ' + v + '</p>').join('');
    const labelImgHtml = item.etiquetaImg
      ? '<a href="' + item.etiquetaImg + '" download="etiqueta-' + (item.detalhes && item.detalhes["Nome do perfume"] || "perfume") + '.png"><img src="' + item.etiquetaImg + '" alt="Etiqueta" style="max-width:200px; display:block; margin:8px 0; border:1px solid rgba(61,58,52,0.2); border-radius:6px;"></a>'
      : '';
    return '<div class="item">' +
      '<p class="item-title">' + item.tipo + '</p>' +
      labelImgHtml +
      details +
      '<p class="item-price">R$ ' + item.preco.toFixed(2).replace('.',',') + '</p>' +
      '<button type="button" class="remove-btn" data-idx="' + idx + '">Remover item</button>' +
    '</div>';
  }).join('');

  itemsArea.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const cart = loadCart();
      cart.splice(parseInt(btn.dataset.idx), 1);
      saveCart(cart);
      render();
    });
  });

  const subtotal = cart.reduce((sum, item) => sum + item.preco, 0);
  const frete = 25;
  const total = subtotal + frete;

  totalsArea.innerHTML =
    '<div class="totals">' +
    '<p><span>Subtotal</span><span>R$ ' + subtotal.toFixed(2).replace('.',',') + '</span></p>' +
    '<p><span>Frete (fixo, todo o Brasil)</span><span>R$ ' + frete.toFixed(2).replace('.',',') + '</span></p>' +
    '<p class="grand"><span>Total</span><span>R$ ' + total.toFixed(2).replace('.',',') + '</span></p>' +
    '</div>' +
    '<a href="checkout.html" class="checkout-btn">Finalizar pedido</a>';
}

render();
</script>
</body>
</html>
