let current = 0;
let notas = {};

function renderProgress() {
  const progress = document.getElementById("progress");
  progress.innerHTML = camadas.map((_, i) => '<div class="' + (i < current ? "done" : "") + '"></div>').join('');
}

function renderCamada() {
  renderProgress();
  const camada = camadas[current];
  const quizArea = document.getElementById("quiz-area");
  quizArea.innerHTML =
    '<p class="question">' + camada.titulo + '</p>' +
    '<p class="question-sub">' + camada.sub + '</p>' +
    '<div class="options">' +
    camada.opcoes.map((o, idx) => '<button type="button" class="option" data-idx="' + idx + '" style="display:flex; align-items:center; gap:12px;"><img src="' + noteIcons[o.icon] + '" style="width:32px; height:32px; flex-shrink:0;">' + o.nome + '</button>').join('') +
    '</div>';

  quizArea.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      notas[camada.key] = camada.opcoes[parseInt(btn.dataset.idx)];
      current++;
      if (current < camadas.length) {
        renderCamada();
      } else {
        renderPyramidSummary();
      }
    });
  });
}

function renderPyramidSummary() {
  document.getElementById("progress").classList.add("hidden");
  document.getElementById("quiz-area").classList.add("hidden");
  const resultArea = document.getElementById("result-area");
  resultArea.classList.remove("hidden");

  resultArea.innerHTML =
    '<p class="result-title" style="text-align:center;">Sua pirâmide olfativa</p>' +
    '<div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">' +
      '<div style="width:0; height:0; border-left:55px solid transparent; border-right:55px solid transparent; border-bottom:70px solid #eef1e6; position:relative; display:flex; align-items:center; justify-content:center;">' +
        '<img src="' + noteIcons[notas.saida.icon] + '" style="width:34px; height:34px; position:absolute; top:30px; left:50%; transform:translateX(-50%);">' +
      '</div>' +
      '<div style="width:0; height:0; border-left:85px solid transparent; border-right:85px solid transparent; border-bottom:80px solid #e3e8d6; position:relative; display:flex; align-items:center; justify-content:center;">' +
        '<img src="' + noteIcons[notas.corpo.icon] + '" style="width:40px; height:40px; position:absolute; top:32px; left:50%; transform:translateX(-50%);">' +
      '</div>' +
      '<div style="width:0; height:0; border-left:120px solid transparent; border-right:120px solid transparent; border-bottom:90px solid #d5dcc0; position:relative; display:flex; align-items:center; justify-content:center;">' +
        '<img src="' + noteIcons[notas.fundo.icon] + '" style="width:46px; height:46px; position:absolute; top:34px; left:50%; transform:translateX(-50%);">' +
      '</div>' +
    '</div>' +
    '<div class="profile-card">' +
      '<div>' +
        '<p class="pyramid-summary"><strong>Saída:</strong> ' + notas.saida.nome + '</p>' +
        '<p class="pyramid-summary"><strong>Corpo:</strong> ' + notas.corpo.nome + '</p>' +
        '<p class="pyramid-summary" style="margin-bottom:0;"><strong>Fundo:</strong> ' + notas.fundo.nome + '</p>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="restart" id="continue-btn" style="border-color:#556238; color:#556238; font-weight:700;">Continuar para personalizar meu perfume →</button>' +
    '<button type="button" class="restart" id="restart-btn">Recomeçar</button>';

  document.getElementById("continue-btn").addEventListener("click", renderCapQuestion);
  document.getElementById("restart-btn").addEventListener("click", () => {
    current = 0;
    notas = {};
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    resultArea.classList.add("hidden");
    renderCamada();
  });
}

let capAnswer = "";
let perfumeName = "";
let placedIcons = [];
let selectedPaletteId = null;
const iconOptions = [
  {id:"coracao", char:"♥"},
  {id:"coracao-vazio", char:"♡"},
  {id:"estrela", char:"★"},
  {id:"sol", char:"☼"},
  {id:"lua", char:"☾"},
  {id:"flor", char:"❀"},
  {id:"flor-fina", char:"✽"},
  {id:"infinito", char:"∞"},
  {id:"estrela-clara", char:"✩"}
];

function renderCapQuestion() {
  const resultArea = document.getElementById("result-area");
  resultArea.innerHTML =
    '<p class="result-title">Escolha a tampa do frasco</p>' +
    '<div class="options" style="margin-bottom:10px;">' +
    '<button type="button" class="option" data-cap="Prata">Tampa Prata</button>' +
    '<button type="button" class="option" data-cap="Preta">Tampa Preta</button>' +
    '</div>';
  resultArea.querySelectorAll("[data-cap]").forEach(btn => {
    btn.addEventListener("click", () => {
      capAnswer = btn.dataset.cap;
      renderLabelEditor();
    });
  });
}

function renderLabelPreview(interactive) {
  const placedHtml = placedIcons.map((p, idx) =>
    '<span class="placed-icon" data-idx="' + idx + '" style="position:absolute; left:' + p.xPct + '%; top:' + p.yPct + '%; transform:translate(-50%,-50%); font-size:26px; color:#556238; cursor:' + (interactive ? 'pointer' : 'default') + ';">' + p.char + '</span>'
  ).join('');

  return '<div id="label-canvas" style="position:relative; background:#fdfbf7; border:1px solid rgba(61,58,52,0.3); border-radius:6px; padding:9px 10px; box-sizing:border-box; width:325px; height:170px; display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto 20px; ' + (interactive ? 'cursor:crosshair;' : '') + '">' +
    '<div style="position:relative; width:48px; height:150px; flex-shrink:0; pointer-events:none;">' +
      '<div style="position:absolute; top:50%; left:50%; width:150px; height:48px; transform:translate(-50%,-50%) rotate(-90deg); font-family:Arial,sans-serif; font-weight:700; font-size:7px; line-height:1.35; color:#000000; display:flex; align-items:center;">' +
        '<span><strong>PERFUME</strong> — Composição: Álcool de Cereais, Essência, Glicerina Bidestilada, Extrato Glicerinado, Água Mineral e Corante Cosmético. NÃO INGERIR. EVITAR CONTATO COM OS OLHOS. USO EXTERNO. <strong>PRODUTO ARTESANAL</strong> · Válido por 1 ano</span>' +
      '</div>' +
    '</div>' +
    '<div style="flex:1; text-align:center; pointer-events:none;">' +
    '<p style="font-family:Georgia,serif; font-weight:700; font-size:14px; letter-spacing:1.5px; margin:0 0 3px; color:#000000;">SAGRADO DE MIM</p>' +
    '<p style="font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:8px; margin:0 0 6px; color:#3d4a33;">uma fragrância feita para você</p>' +
    '<p style="font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:19px; margin:0; color:#000000;">' + (perfumeName || "Nome do perfume") + '</p>' +
    '</div>' +
    placedHtml +
  '</div>';
}

function renderLabelEditor() {
  const resultArea = document.getElementById("result-area");
  resultArea.innerHTML =
    '<p class="result-title">Personalize sua etiqueta</p>' +
    '<div id="label-preview"></div>' +
    '<p class="profile-desc" style="margin-bottom:6px; font-weight:700;">Nome do perfume</p>' +
    '<input type="text" id="name-input" placeholder="Ex: Encanto, Lua Nova..." style="width:100%; font-family:Arial,sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid rgba(61,58,52,0.3); margin-bottom:16px;">' +
    '<p class="profile-desc" style="margin-bottom:6px; font-weight:700;">Escolha um elemento e clique na etiqueta para posicioná-lo</p>' +
    '<div class="options" style="flex-direction:row; flex-wrap:wrap; gap:8px; margin-bottom:8px;">' +
    iconOptions.map(o => '<button type="button" class="option icon-palette" data-id="' + o.id + '" style="width:auto; padding:12px 18px; font-size:34px; line-height:1; color:#556238;">' + o.char + '</button>').join('') +
    '</div>' +
    '<p class="step-label" style="text-align:left; margin:0 0 16px;">Clique num elemento acima, depois clique na etiqueta pra posicioná-lo. Clique num elemento já colocado para removê-lo.</p>' +
    '<button type="button" class="restart" id="finish-btn" style="border-color:#556238; color:#556238; font-weight:700;">Concluir personalização</button>';

  const updatePreview = () => {
    document.getElementById("label-preview").innerHTML = renderLabelPreview(true);
    attachCanvasEvents();
  };

  function attachCanvasEvents() {
    const canvas = document.getElementById("label-canvas");
    canvas.addEventListener("click", (e) => {
      if (e.target.classList.contains("placed-icon")) return;
      if (!selectedPaletteId) return;
      const rect = canvas.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      const opt = iconOptions.find(o => o.id === selectedPaletteId);
      placedIcons.push({id: opt.id, char: opt.char, xPct, yPct});
      updatePreview();
    });
    canvas.querySelectorAll(".placed-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        placedIcons.splice(parseInt(el.dataset.idx), 1);
        updatePreview();
      });
    });
  }

  updatePreview();

  document.getElementById("name-input").addEventListener("input", (e) => {
    perfumeName = e.target.value;
    updatePreview();
  });

  resultArea.querySelectorAll(".icon-palette").forEach(btn => {
    btn.addEventListener("click", () => {
      resultArea.querySelectorAll(".icon-palette").forEach(b => { b.style.background = ""; b.style.borderColor = ""; });
      if (selectedPaletteId === btn.dataset.id) {
        selectedPaletteId = null;
      } else {
        selectedPaletteId = btn.dataset.id;
        btn.style.background = "#f2efe5";
        btn.style.borderColor = "#7d9169";
      }
    });
  });

  document.getElementById("finish-btn").addEventListener("click", async () => {
    const finishBtn = document.getElementById("finish-btn");
    finishBtn.disabled = true;
    finishBtn.textContent = "Gerando etiqueta...";
    try {
      const canvasEl = document.getElementById("label-canvas");
      const canvas = await html2canvas(canvasEl, {backgroundColor: "#fdfbf7", scale: 5});
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      const formData = new FormData();
      formData.append("file", blob);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      labelImageDataUrl = data.secure_url || null;
    } catch (err) {
      labelImageDataUrl = null;
    }
    renderFinalSummary();
  });
}

const CLOUDINARY_CLOUD_NAME = "ld4xgnhw";
const CLOUDINARY_UPLOAD_PRESET = "vb70iaep";
let labelImageDataUrl = null;

function renderFinalSummary() {
  const resultArea = document.getElementById("result-area");

  const orderItem = {
    tipo: "Perfume Personalizado (Monte o Seu)",
    preco: 150,
    etiquetaImg: labelImageDataUrl,
    iconsPosicionados: placedIcons,
    detalhes: {
      "Notas de Saída": notas.saida.nome,
      "Notas de Corpo": notas.corpo.nome,
      "Notas de Fundo": notas.fundo.nome,
      "Tampa": capAnswer,
      "Nome do perfume": perfumeName || "(não definido)",
      "Elementos na etiqueta": placedIcons.length ? placedIcons.length + " elemento(s) posicionado(s)" : "Nenhum"
    }
  };

  const cart = JSON.parse(localStorage.getItem("sagradoCart") || "[]");
  cart.push(orderItem);
  localStorage.setItem("sagradoCart", JSON.stringify(cart));

  resultArea.innerHTML =
    '<p class="result-title">Adicionado ao carrinho!</p>' +
    renderLabelPreview(false) +
    '<p class="profile-desc"><strong>Perfume Personalizado</strong> — R$ 150,00</p>' +
    '<p class="profile-desc"><strong>Saída:</strong> ' + notas.saida.nome + ' · <strong>Corpo:</strong> ' + notas.corpo.nome + ' · <strong>Fundo:</strong> ' + notas.fundo.nome + '</p>' +
    '<p class="profile-desc"><strong>Tampa:</strong> ' + capAnswer + '</p>' +
    '<a href="carrinho.html" class="restart" style="display:block; text-align:center; text-decoration:none; border-color:#556238; color:#556238; font-weight:700; margin-top:14px;">Ir para o carrinho →</a>' +
    '<button type="button" class="restart" id="restart-final" style="margin-top:10px;">Montar outro perfume</button>';

  document.getElementById("restart-final").addEventListener("click", () => {
    current = 0; notas = {}; capAnswer = ""; perfumeName = ""; placedIcons = []; selectedPaletteId = null; labelImageDataUrl = null;
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    renderCamada();
  });
}

renderCamada();
</script>
