let stage = "gender";
let genderAnswer = "";
let activeQuestions = [];
let current = 0;
let scores = {};
let occasionAnswer = "";
let answerLog = []; // guarda a família (ou null) escolhida em cada pergunta, na ordem, pra poder desfazer ao voltar

function renderProgress() {
  const bar = document.getElementById("progress");
  bar.innerHTML = "";
  const total = activeQuestions.length || 1;
  for (let i = 0; i < total; i++) {
    const dot = document.createElement("div");
    if (i <= current) dot.className = "done";
    bar.appendChild(dot);
  }
}

function renderGenderQuestion() {
  const area = document.getElementById("quiz-area");
  document.getElementById("progress").innerHTML = '<div class="done" style="flex:1;"></div>';
  area.innerHTML =
    '<p class="question">' + genderQuestion.q + '</p>' +
    '<div class="options">' +
    genderQuestion.opts.map((o, idx) =>
      '<button type="button" class="option" data-idx="' + idx + '">' + o.t + '</button>'
    ).join('') +
    '</div>' +
    '<a href="index.html" id="back-btn" style="display:inline-block; margin-top:12px; color:#8a8676; font-family:Arial,sans-serif; font-size:13px; text-decoration:none;">&larr; Voltar ao início</a>';

  area.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      const opt = genderQuestion.opts[parseInt(btn.dataset.idx)];
      genderAnswer = opt.v;
      activeQuestions = [occasionQuestion, ...questionSets[genderAnswer]];
      answerLog = [];
      stage = "quiz";
      current = 0;
      renderQuestion();
    });
  });
}

function goBack() {
  if (current === 0) {
    // volta pra pergunta de gênero, desfazendo tudo (nenhuma pontuação foi dada ainda nesse ponto)
    genderAnswer = "";
    activeQuestions = [];
    answerLog = [];
    scores = {};
    occasionAnswer = "";
    stage = "gender";
    renderGenderQuestion();
    return;
  }
  current--;
  const lastFamily = answerLog.pop();
  if (lastFamily) {
    scores[lastFamily] = Math.max(0, (scores[lastFamily] || 0) - 1);
  }
  if (current === 0 && activeQuestions[0] && activeQuestions[0].isOccasion) {
    occasionAnswer = "";
  }
  renderQuestion();
}

function renderQuestion() {
  renderProgress();
  const area = document.getElementById("quiz-area");
  const item = activeQuestions[current];
  area.innerHTML =
    '<p class="question">' + item.q + '</p>' +
    '<div class="options">' +
    item.opts.map((o, idx) =>
      '<button type="button" class="option" data-idx="' + idx + '">' + o.t + '</button>'
    ).join('') +
    '</div>' +
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">' +
      '<button type="button" id="back-btn" style="background:none; border:none; color:#8a8676; font-family:Arial,sans-serif; font-size:13px; cursor:pointer; padding:0;">&larr; Voltar</button>' +
      '<p class="step-label" style="margin:0;">Pergunta ' + (current+2) + ' de ' + (activeQuestions.length+1) + '</p>' +
    '</div>';

  document.getElementById("back-btn").addEventListener("click", goBack);

  area.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      const opt = item.opts[parseInt(btn.dataset.idx)];
      if (item.isOccasion) {
        occasionAnswer = opt.t;
        answerLog.push(null);
      } else {
        scores[opt.f] = (scores[opt.f] || 0) + 1;
        answerLog.push(opt.f);
      }
      current++;
      if (current < activeQuestions.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    });
  });
}

function renderResult() {
  document.getElementById("progress").classList.add("hidden");
  document.getElementById("quiz-area").classList.add("hidden");
  const resultArea = document.getElementById("result-area");
  resultArea.classList.remove("hidden");

  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const top = sorted.slice(0, 2).map(e => e[0]);

  const genderLabels = {feminino:"Feminino", masculino:"Masculino", unissex:"Unissex"};
  let html = '<p class="result-title">Gênero</p>' +
    '<p class="profile-desc" style="margin-bottom:18px;">' + genderLabels[genderAnswer] + '</p>' +
    '<p class="result-title">Ocasião desejada</p>' +
    '<p class="profile-desc" style="margin-bottom:18px;">' + occasionAnswer + '</p>' +
    '<p class="result-title">Seu perfil aromático</p>';
  top.forEach((key, i) => {
    const p = profiles[key];
    html += '<div class="profile-card" style="background:' + p.bg + ';">' +
      '<div class="profile-icon" style="color:' + p.cor + ';">' + p.icon + '</div>' +
      '<div><p class="profile-name" style="color:' + p.cor + ';">' + (i===0 ? "Dominante: " : "Também presente: ") + p.nome + '</p>' +
      '<p class="profile-desc">' + p.desc + '</p></div>' +
    '</div>';
  });
  html += '<button type="button" class="restart" id="restart-btn">Refazer o quiz</button>';
  html += '<button type="button" class="restart" id="continue-btn" style="border-color:#556238; color:#556238; font-weight:700; margin-top:10px;">Continuar para personalizar meu perfume →</button>';

  resultArea.innerHTML = html;
  document.getElementById("continue-btn").addEventListener("click", renderCapQuestion);
  document.getElementById("restart-btn").addEventListener("click", () => {
    stage = "gender";
    genderAnswer = "";
    activeQuestions = [];
    current = 0;
    scores = {};
    occasionAnswer = "";
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    resultArea.classList.add("hidden");
    renderGenderQuestion();
  });
}

function renderLabelPreview(interactive) {
  const placedHtml = placedIcons.map((p, idx) =>
    '<span class="placed-icon" data-idx="' + idx + '" style="position:absolute; left:' + p.xPct + '%; top:' + p.yPct + '%; transform:translate(-50%,-50%); font-size:18px; color:#556238; cursor:' + (interactive ? 'pointer' : 'default') + ';">' + p.char + '</span>'
  ).join('');

  // Tamanho real da etiqueta: 65mm x 34mm (formato paisagem, pra frasco)
  return '<div id="label-canvas" style="position:relative; background:#fdfbf7; border:1px solid rgba(61,58,52,0.3); border-radius:6px; padding:8px; box-sizing:border-box; width:325px; height:170px; display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto 20px; ' + (interactive ? 'cursor:crosshair;' : '') + '">' +
    '<div style="flex:1; text-align:center; pointer-events:none;">' +
    '<p style="font-family:Georgia,serif; font-size:15px; letter-spacing:1.8px; margin:0 0 3px; color:#332f28;">SAGRADO DE MIM</p>' +
    '<p style="font-family:Georgia,serif; font-style:italic; font-size:9px; margin:3px 0 7px; color:#7d9169;">uma fragrância feita para você</p>' +
    '<p style="font-family:Georgia,serif; font-style:italic; font-size:24px; margin:7px 0 3px; color:#332f28;">' + (perfumeName || "Nome do perfume") + '</p>' +
    '</div>' +
    '<div style="position:relative; width:52px; height:150px; flex-shrink:0; pointer-events:none;">' +
      '<div style="position:absolute; top:0; left:0; width:150px; height:52px; transform-origin:0 0; transform:rotate(90deg) translate(0,-100%); font-family:Arial,sans-serif; font-size:5.4px; line-height:1.35; color:#4a463e; border-top:1px solid rgba(61,58,52,0.2); padding-top:4px;">' +
        '<span style="font-weight:700; color:#332f28;">PERFUME · </span>' +
        'Composição: Álcool de Cereais, Essência, Glicerina Bidestilada, Extrato Glicerinado, Água Mineral e Corante Cosmético. · ' +
        'NÃO INGERIR E EVITAR CONTATO COM OS OLHOS. USO EXTERNO · ' +
        '<span style="font-weight:700; color:#332f28;">PRODUTO ARTESANAL</span> · Válido por 1 ano' +
      '</div>' +
    '</div>' +
    placedHtml +
  '</div>';
}

function renderLabelEditor() {
  const resultArea = document.getElementById("result-area");
  resultArea.innerHTML =
    '<p class="result-title">Personalize sua etiqueta</p>' +
    '<div id="label-preview"></div>' +
    '<p class="profile-desc" style="margin-bottom:6px; font-weight:700;">Nome do perfume</p>' +
    '<input type="text" id="name-input" placeholder="Ex: Encanto, Lua Nova..." style="width:100%; font-family:Arial,sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid rgba(61,58,52,0.3); margin-bottom:16px;">' +
    '<p class="profile-desc" style="margin-bottom:6px; font-weight:700;">Escolha um elemento e clique na etiqueta para posicioná-lo</p>' +
    '<div class="options" style="flex-direction:row; flex-wrap:wrap; gap:8px; margin-bottom:8px;">' +
    iconOptions.map(o => '<button type="button" class="option icon-palette" data-id="' + o.id + '" style="width:auto; padding:10px 16px; font-size:26px; line-height:1;">' + o.char + '</button>').join('') +
    '</div>' +
    '<p class="step-label" style="text-align:left; margin:0 0 16px;">Clique num elemento acima, depois clique na etiqueta pra posicioná-lo. Clique num elemento já colocado para removê-lo.</p>' +
    '<p class="profile-desc" style="margin-bottom:6px; font-weight:700;">Você tem um perfume preferido ou de referência? (opcional)</p>' +
    '<textarea id="reference-input" placeholder="Ex: Sou fã de perfumes amadeirados tipo Malbec, ou já usei um floral da Natura que amei..." rows="3" style="width:100%; font-family:Arial,sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid rgba(61,58,52,0.3); margin-bottom:16px; resize:vertical;"></textarea>' +
    '<button type="button" class="restart" id="finish-btn" style="border-color:#556238; color:#556238; font-weight:700;">Concluir personalização</button>';

  const updatePreview = () => {
    document.getElementById("label-preview").innerHTML = renderLabelPreview(true);
    attachCanvasEvents();
  };

  function attachCanvasEvents() {
    const canvas = document.getElementById("label-canvas");
    canvas.addEventListener("click", (e) => {
      if (e.target.classList.contains("placed-icon")) return; // handled separately
      if (!selectedPaletteId) return;
      const rect = canvas.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      const opt = iconOptions.find(o => o.id === selectedPaletteId);
      placedIcons.push({id: opt.id, char: opt.char, xPct, yPct});
      updatePreview();
    });
    canvas.querySelectorAll(".placed-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        placedIcons.splice(parseInt(el.dataset.idx), 1);
        updatePreview();
      });
    });
  }

  updatePreview();

  document.getElementById("name-input").addEventListener("input", (e) => {
    perfumeName = e.target.value;
    updatePreview();
  });

  resultArea.querySelectorAll(".icon-palette").forEach(btn => {
    btn.addEventListener("click", () => {
      resultArea.querySelectorAll(".icon-palette").forEach(b => { b.style.background = ""; b.style.borderColor = ""; });
      if (selectedPaletteId === btn.dataset.id) {
        selectedPaletteId = null;
      } else {
        selectedPaletteId = btn.dataset.id;
        btn.style.background = "#f2efe5";
        btn.style.borderColor = "#7d9169";
      }
    });
  });

  document.getElementById("finish-btn").addEventListener("click", async () => {
    referenceAnswer = document.getElementById("reference-input").value.trim();
    const finishBtn = document.getElementById("finish-btn");
    finishBtn.disabled = true;
    finishBtn.textContent = "Gerando etiqueta...";
    try {
      const canvasEl = document.getElementById("label-canvas");
      const canvas = await html2canvas(canvasEl, {backgroundColor: "#fdfbf7", scale: 3});
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

      if (CLOUDINARY_CLOUD_NAME.includes("COLE_AQUI")) {
        // Cloudinary ainda não conectado: usa a imagem reduzida como reserva
        labelImageDataUrl = canvas.toDataURL("image/jpeg", 0.5);
      } else {
        const formData = new FormData();
        formData.append("file", blob);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        labelImageDataUrl = data.secure_url || null;
      }
    } catch (err) {
      labelImageDataUrl = null;
    }
    renderFinalSummary();
  });
}

// ATENÇÃO: cole aqui o Cloud name e o Upload preset (unsigned) do Cloudinary
const CLOUDINARY_CLOUD_NAME = "ld4xgnhw";
const CLOUDINARY_UPLOAD_PRESET = "vb70iaep";

let labelImageDataUrl = null;

function renderFinalSummary() {
  const resultArea = document.getElementById("result-area");
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const topProfile = profiles[sorted[0][0]].nome;
  const secondProfile = sorted[1] ? profiles[sorted[1][0]].nome : null;
  const genderLabels = {feminino:"Feminino", masculino:"Masculino", unissex:"Unissex"};

  const orderItem = {
    tipo: "Perfume Personalizado",
    preco: 150,
    etiquetaImg: labelImageDataUrl,
    detalhes: {
      "Gênero": genderLabels[genderAnswer],
      "Ocasião": occasionAnswer,
      "Perfil aromático dominante": topProfile,
      "Perfil aromático secundário": secondProfile || "—",
      "Tampa": capAnswer,
      "Nome do perfume": perfumeName || "(não definido)",
      "Elementos na etiqueta": placedIcons.length ? placedIcons.length + " elemento(s) posicionado(s)" : "Nenhum",
      "Perfume de referência": referenceAnswer || "Não informado"
    }
  };

  const cart = JSON.parse(localStorage.getItem("sagradoCart") || "[]");
  cart.push(orderItem);
  localStorage.setItem("sagradoCart", JSON.stringify(cart));

  resultArea.innerHTML =
    '<p class="result-title">Adicionado ao carrinho!</p>' +
    renderLabelPreview(false) +
    '<p class="profile-desc"><strong>Perfume Personalizado</strong> — R$ 150,00</p>' +
    '<p class="profile-desc"><strong>Perfil aromático dominante:</strong> ' + topProfile + '</p>' +
    (secondProfile ? '<p class="profile-desc"><strong>Perfil aromático secundário:</strong> ' + secondProfile + '</p>' : '') +
    '<p class="profile-desc"><strong>Tampa:</strong> ' + capAnswer + '</p>' +
    '<a href="carrinho.html" class="restart" style="display:block; text-align:center; text-decoration:none; border-color:#556238; color:#556238; font-weight:700; margin-top:14px;">Ir para o carrinho →</a>' +
    '<button type="button" class="restart" id="restart-final" style="margin-top:10px;">Fazer outro perfume</button>';

  document.getElementById("restart-final").addEventListener("click", () => {
    stage = "gender"; genderAnswer = ""; activeQuestions = []; current = 0; scores = {}; answerLog = [];
    occasionAnswer = ""; capAnswer = ""; perfumeName = ""; placedIcons = []; selectedPaletteId = null; labelImageDataUrl = null; referenceAnswer = "";
    document.getElementById("progress").classList.remove("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    renderGenderQuestion();
  });
}

renderGenderQuestion();
